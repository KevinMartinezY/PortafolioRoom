<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portafolio | Kev</title>

  <!-- Bootstrap 5 + Bootstrap Icons por CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="patita.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="patita.png">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="sala" id="sala">
    <img src="H2.png" class="sala-img" alt="Sala de juegos con una pantalla de proyección">

    <!-- Capas de luz (modo oscuro) -->
    <div class="sala-noche"></div>
    <div class="sala-luz"></div>
    <div class="lava-glow"></div>

    <!-- ===== PANTALLA DEL PROYECTOR ===== -->
    <div class="pantalla-wrap">
      <div class="pantalla" id="pantalla">
        <!-- Todo lo "proyectado" vive aquí; el JS lo ajusta en perspectiva a la tela -->
        <div class="proyeccion" id="proyeccion">

          <!-- Vista inicial: botón play -->
          <div class="vista-inicio">
            <button class="play" id="btn-play" type="button" aria-label="Ver mis proyectos">
              <i class="bi bi-play-fill"></i>
            </button>
            <span class="play-texto">Reproducir</span>
          </div>

          <!-- Vista proyectos: carrusel automático (fundido, sin indicadores) -->
          <div class="vista-proyectos">
            <div id="carruselProyectos" class="carousel slide carousel-fade">
              <div class="carousel-inner">
                <!-- Cambia href y --c (color) por tus proyectos.
                     Para usar imagen: <a class="proyecto" href="..."><img src="..." alt="..."></a> -->
                <div class="carousel-item active">
                  <a class="proyecto" href="https://ajoloteygrulla.vercel.app/" target="_blank" style="--c:#ff6b6b">
                    <video src="demo.mp4" loop playsinline></video>
                  </a>
                </div>
                <div class="carousel-item">
                  <a class="proyecto" href="#" style="--c:#4d9bff"></a>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Flechas: están en el marco de la pantalla, no forman parte de la proyección -->
    <button class="flecha flecha-prev" id="btn-prev" type="button" title="Anterior" aria-label="Proyecto anterior">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button class="flecha flecha-next" id="btn-next" type="button" title="Siguiente" aria-label="Proyecto siguiente">
      <i class="bi bi-chevron-right"></i>
    </button>

    <!-- Botón para volver al modo luz (sobre el proyector) -->
    <button class="apagar" id="btn-apagar" type="button" title="Volver al modo luz" aria-label="Volver al modo luz">
      <i class="bi bi-power"></i>
    </button>

    <!-- ===== PÓSTERS ===== -->
    <a class="poster p1" href="https://github.com/KevinMartinezY" target="_blank" rel="noopener" style="--neon:#7df9ff"
      data-label="GitHub" aria-label="GitHub">
      <span class="poster-cara"><i class="bi bi-github"></i></span>
    </a>
    <a class="poster p2" href="https://www.linkedin.com/in/kevinmartinezy/" target="_blank" rel="noopener"
      style="--neon:#4d9bff" data-label="LinkedIn" aria-label="LinkedIn">
      <span class="poster-cara"><i class="bi bi-linkedin"></i></span>
    </a>
    <a class="poster p3" href="Kevin Adair Martínez Yáñez - CV.pdf" download="Kevin Adair Martinez Yañez.pdf" target="_blank" rel="noopener" style="--neon:#ffe66d" data-label="Mi CV"
      aria-label="Mi CV">
      <span class="poster-cara"><i class="bi bi-file-earmark-person"></i></span>
    </a>
    <a class="poster p4" href="mailto:kevinadairmtzyanez@gmail.com" style="--neon:#ff5ec4" data-label="Contacto" aria-label="Contacto">
      <span class="poster-cara"><i class="bi bi-envelope"></i></span>
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
